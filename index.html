 ellipse(0,15,53,11,"#070a14a0");
 // Tail is expressive and sways independently.
 ctx.strokeStyle="#161922";ctx.lineWidth=18;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-31,-53);ctx.bezierCurveTo(-65,-76,-76,-21,-89,-46+Math.sin(t*4)*11);ctx.stroke();
 ctx.strokeStyle="#31303b";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-33,-54);ctx.bezierCurveTo(-66,-75,-74,-21,-87,-44+Math.sin(t*4)*10);ctx.stroke();
 // Animated feet.
 rrect(-26+step,-26,19,33,8,"#171922");rrect(6-step,-26,19,33,8,"#12141b");
 ellipse(-17+step,5,14,7,"#282932");ellipse(16-step,5,14,7,"#262734");
 var body=ctx.createLinearGradient(-40,-95,38,-25);body.addColorStop(0,"#35323c");body.addColorStop(.5,"#101319");body.addColorStop(1,"#282b36");
 ellipse(-1,-52,41,49,body);ellipse(13,-46,18,27,"#55546233");
 path([-42,-97,-30,-136,-5,-109,25,-137,42,-96],"#151821");
 path([-36,-101,-29,-127,-12,-107],"#40333b");
 path([11,-109,24,-128,35,-99],"#44353b");
 ellipse(0,-92,42,38,body);
 // Side-glance animation with a warm golden iris.
 ellipse(19,-98,11,13,"#f0c57f");ellipse(23,-99,4.9,9,"#302b32");ellipse(24,-102,2,2,"#fff2d9");
 ellipse(-8,-98,8,12,"#cda86b");ellipse(-6,-98,3.4,8,"#342c32");
 path([7,-81,16,-84,11,-77],"#c99392");
 for(var k=-1;k<=1;k++){line(11,-81,43,-82+k*8,"#b7a8a0",1.2);line(5,-81,-26,-82+k*8,"#b7a8a0",1.2)}
 ctx.restore()
}
function drawScene(){
 var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#101a27");g.addColorStop(1,"#252133");fill(0,0,WORLD,H,g);
 woodPanels(0,980,"#343044");woodPanels(980,1950,"#3a3040");woodPanels(1950,2920,"#292b3e");woodPanels(2920,WORLD,"#30283a");
 // Atmospheric overlays from the original Manor asset, used only in the library.
 if(bg.complete&&bg.naturalWidth){ctx.globalAlpha=.18;ctx.drawImage(bg,0,0,980,575);ctx.globalAlpha=1}
 for(var x=0;x<WORLD;x+=480){line(x,92,x,562,"#b0926a75",15);line(x+13,93,x+13,560,"#211b25",3)}
 tallWindow(545);tallWindow(1135);tallWindow(2180);tallWindow(3160);
 bookshelf(34,225);bookshelf(302,190);bookshelf(838,126);
 fireplace(708);rrect(622,244,174,19,2,"#b18a61");candle(659,210);candle(754,210);
 sealedDoor(1357);clockcase(1655);
 lamp(410);lamp(1200);lamp(1890);lamp(2450);lamp(3300);
 portrait(2055,204,0);portrait(2335,189,1);portrait(2743,220,2);
 stairs(2990);chest(3588);
 rug(155,530);rug(1150,640);rug(2130,570);rug(3160,555);
 floorBoard();
 // Foreground scenery, kept behind Mallow.
 fern(1835,clock);wisp(2560,clock);
 // Floating ambient dust in the foreground.
 for(var n=0;n<82;n++){
  var dx=(n*199+Math.sin(clock*.55+n*2)*35)%WORLD;
  if(dx<cam-50||dx>cam+vw+50)continue;
  var dy=100+(n*131%380)+Math.sin(clock*.9+n)*21;
  ellipse(dx,dy,1.2+(n%3)*.4,1.2+(n%2)*.4,n%5===0?"#c4d4ef83":"#f6dcbb6b");
 }
 mallow(px,clock,Math.abs(walkSpeed)>2,dir);
 // Soft pool of light moves with the cat.
 glow(px,450,100,"#ffe2a414")
}
var bg=new Image();bg.src="assets/mystery_manor_library_bg.webp?v=2";
function resize(){
 var rect=$("viewport").getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));
 vw=Math.max(200,Math.min(WORLD,H*rect.width/Math.max(1,rect.height)));
}
window.addEventListener("resize",resize);resize();
function holdButton(id,key){
 var el=$(id);
 el.addEventListener("pointerdown",function(e){e.preventDefault();keys[key]=true;target=null;el.classList.add("pressed");try{el.setPointerCapture(e.pointerId)}catch(err){}});
 function stop(){keys[key]=false;el.classList.remove("pressed")}
 ["pointerup","pointercancel","lostpointercapture"].forEach(function(n){el.addEventListener(n,stop)});
}
holdButton("left","left");holdButton("right","right");
window.addEventListener("pointerup",function(){keys.left=false;keys.right=false;$("left").classList.remove("pressed");$("right").classList.remove("pressed")});
window.addEventListener("blur",function(){keys.left=false;keys.right=false;target=null});
window.addEventListener("keydown",function(e){
 if(["ArrowLeft","a","A"].includes(e.key)){keys.left=true;target=null;e.preventDefault()}
 if(["ArrowRight","d","D"].includes(e.key)){keys.right=true;target=null;e.preventDefault()}
});
window.addEventListener("keyup",function(e){if(["ArrowLeft","a","A"].includes(e.key))keys.left=false;if(["ArrowRight","d","D"].includes(e.key))keys.right=false});
canvas.addEventListener("pointerdown",function(e){
 var r=canvas.getBoundingClientRect(),tap=(e.clientX-r.left)/r.width*vw+cam;
 target=clamp(tap,70,WORLD-72);
});
var walkSpeed=0;
function updateStory(){
 var room=rooms.find(function(r){return px>=r.x&&px<r.end})||rooms[3];
 if(room.name!==roomName){roomName=room.name;$("where").textContent=roomName}
 $("position-fill").style.width=(100*px/(WORLD-80)).toFixed(1)+"%";
 var closest=-1,dist=1e8;
 for(var i=0;i<beats.length;i++){var d=Math.abs(beats[i].x-px);if(d<beats[i].w&&d<dist){closest=i;dist=d}}
 if(closest!==beat){
  beat=closest;var panel=$("story");
  panel.classList.toggle("visible",beat!==-1);
  if(beat>=0){var b=beats[beat];$("speaker").textContent=b.speaker;$("speech").textContent=b.text;$("face").style.backgroundPosition=(b.face===0?"0%":b.face===1?"50%":"100%")+" 50%"}
 }
}
function frame(ms){
 var dt=Math.min(.04,Math.max(0,(ms-last)/1000||.016));last=ms;clock+=dt;
 var move=(keys.right?1:0)-(keys.left?1:0);
 if(move===0&&target!==null){var delta=target-px;move=Math.abs(delta)<7?0:Math.sign(delta);if(!move)target=null}
 walkSpeed=lerp(walkSpeed,move*285,Math.min(1,dt*12));
 if(move===0&&Math.abs(walkSpeed)<1)walkSpeed=0;
 px=clamp(px+walkSpeed*dt,72,WORLD-72);
 if(px===72&&walkSpeed<0||px===WORLD-72&&walkSpeed>0)walkSpeed=0;
 if(Math.abs(walkSpeed)>3){dir=Math.sign(walkSpeed);walk+=dt}
 var camTarget=clamp(px-vw*.41,0,Math.max(0,WORLD-vw));cam=lerp(cam,camTarget,Math.min(1,dt*7.6));
 if(Math.abs(cam-camTarget)<.4)cam=camTarget;
 var scale=canvas.height/H,cssW=canvas.width/scale;
 ctx.setTransform(scale,0,0,scale,0,0);ctx.fillStyle="#0e1420";ctx.fillRect(0,0,cssW,H);
 ctx.save();ctx.translate(-cam,0);drawScene();ctx.restore();
 updateStory();
 requestAnimationFrame(frame);
}
updateStory();requestAnimationFrame(frame);
window.MysteryManorWalk={getState:function(){return{x:Math.round(px),camera:Math.round(cam),viewWidth:Math.round(vw),room:roomName,moving:Math.abs(walkSpeed)>3,story:beat>=0?beats[beat].speaker:null,track:tracks[trackIndex].title,musicPlaying:playing}},moveTo:function(x){px=clamp(x,72,WORLD-72);target=null;return px},version:"Side-scroll 1.0"};
})();
