<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060609">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Failure Entertainment | Studio Introduction</title>
<style>
:root{color-scheme:dark;--gold:#e5c38b;--goldlight:#fff2ca;--dim:#9f855f;background:#060609}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050608}
body{font-family:Georgia,"Times New Roman",serif;color:#f6e4bf;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid #fff1c4;outline-offset:4px}
#stage{position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;height:100vh;height:100dvh;background:radial-gradient(ellipse at 50% 56%,#241d17 0%,#101016 39%,#060609 78%)}
#stage:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 40% 38%,#e9bc7931 0%,transparent 27%),radial-gradient(circle at 62% 65%,#907a5830 0%,transparent 33%);filter:blur(35px);pointer-events:none;opacity:.4}
#stage:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 16vw 9vw #030305bd;pointer-events:none;z-index:8}
#embers{position:absolute;inset:0;z-index:1;pointer-events:none}
.ember{position:absolute;border-radius:100%;width:2px;height:2px;background:#f3d49b;box-shadow:0 0 8px 2px #f3b86eaa;opacity:0}
.playing .ember{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%{transform:translateY(35px);opacity:0}22%{opacity:.55}75%{opacity:.38}100%{transform:translateY(-90px);opacity:0}}
#content{width:100%;max-width:760px;min-height:470px;position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:50px 20px 60px}
#crestwrap{position:relative;width:clamp(126px,28vh,250px);height:clamp(175px,37vh,300px);margin-bottom:8px;filter:drop-shadow(0 7px 22px #000c);opacity:0;transform:translateY(20px) scale(.87)}
.playing #crestwrap{animation:crestEnter 1.4s .1s ease-out forwards,crestFlicker .8s 1.67s steps(1,end) forwards}
@keyframes crestEnter{0%{opacity:0;transform:translateY(28px) scale(.78)}70%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes crestFlicker{0%,15%,40%,100%{opacity:1}10%,31%{opacity:.22}}
#crest{width:100%;height:100%;overflow:visible}
#shieldLeft,#shieldRight{transform-box:fill-box;transform-origin:center}
.playing #shieldLeft{animation:splitLeft 1.15s 1.45s cubic-bezier(.13,.7,.15,1) forwards}
.playing #shieldRight{animation:splitRight 1.15s 1.45s cubic-bezier(.13,.7,.15,1) forwards}
@keyframes splitLeft{0%,18%{transform:translate(0,0)}31%{transform:translate(-5px,1px) rotate(-1.8deg)}62%,100%{transform:translate(-2px,1px) rotate(-.8deg)}}
@keyframes splitRight{0%,18%{transform:translate(0,0)}31%{transform:translate(5px,-1px) rotate(1.8deg)}62%,100%{transform:translate(2px,-1px) rotate(.8deg)}}
#crack{opacity:0;stroke-dasharray:300;stroke-dashoffset:300;filter:drop-shadow(0 0 6px #ffe8ab9e)}
.playing #crack{animation:crackReveal .65s 1.44s ease-in-out forwards}
@keyframes crackReveal{0%{opacity:0;stroke-dashoffset:300}10%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
#burst{position:absolute;width:200%;height:130%;left:-50%;top:-20%;opacity:0;border-radius:50%;z-index:-1;background:radial-gradient(ellipse,#ffeab7c2 0%,#cf9e6540 27%,transparent 65%);pointer-events:none}
.playing #burst{animation:lightBurst .72s 1.9s ease-out forwards}
@keyframes lightBurst{0%{opacity:0;transform:scale(.3)}15%{opacity:.9}100%{opacity:0;transform:scale(2)}}
#studio{position:relative;text-align:center;opacity:0;transform:translateY(15px);width:100%}
.playing #studio{animation:wordEnter 1.1s 2.2s ease-out forwards}
@keyframes wordEnter{0%{opacity:0;filter:blur(8px);transform:translateY(16px)}100%{opacity:1;filter:blur(0);transform:translateY(0)}}
#studio .failure{font-size:clamp(43px,10.3vw,83px);font-weight:500;letter-spacing:.07em;line-height:.99;color:#f9e3b8;text-shadow:0 2px 13px #9a764c51,0 9px 24px #000}
.rule{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:15px}
.rule span{display:block;flex:1;max-width:100px;height:1px;background:linear-gradient(90deg,transparent,#cba06f)}
.rule span:last-child{transform:scaleX(-1)}
.rule b{font:700 clamp(12px,2.1vw,18px) Arial,sans-serif;letter-spacing:clamp(3px,.95vw,8px);white-space:nowrap;color:#d6b784}
#tagline{font-size:clamp(14px,3.6vw,22px);font-style:italic;color:#ddc29d;text-align:center;opacity:0;transform:translateY(10px);line-height:1.35;margin:23px auto 0;max-width:95%;text-shadow:0 2px 9px #000}
.playing #tagline{animation:tagEnter 1.35s 3.8s ease-out forwards}
@keyframes tagEnter{0%{opacity:0;transform:translateY(12px);filter:blur(2px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
#prestart{position:absolute;inset:0;z-index:15;background:#060609ed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;text-align:center}
#prestart[hidden]{display:none!important}
#prestart .small{font:800 10px Arial,sans-serif;letter-spacing:3.6px;color:#c8a773}
#prestart h1{margin:0;font:500 clamp(30px,8vw,58px)/1.12 Georgia,serif;letter-spacing:1px;color:#f7dfb6}
#prestart h1 span{display:block;font:700 clamp(12px,2.5vw,17px) Arial,sans-serif;letter-spacing:clamp(3px,1vw,8px);color:#c6a67a;margin-top:9px}
#prestart p{font:14px/1.5 Georgia,serif;color:#c4ae90;max-width:315px;margin:0}
#begin,#replay{border:1px solid #f1d19c;background:linear-gradient(155deg,#e9c995,#b28957);color:#1b1721;font:800 14px Arial,sans-serif;letter-spacing:.7px;border-radius:11px;padding:16px 24px;min-height:55px;box-shadow:0 5px 0 #6b4d32,0 16px 30px #0009}
#begin:active,#replay:active{transform:translateY(4px);box-shadow:0 1px 0 #6b4d32}
#tools{position:absolute;z-index:12;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:15px;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
.playing #tools{opacity:1;pointer-events:auto}
#replay{min-height:38px;padding:10px 15px;font-size:11px;box-shadow:0 2px 0 #6b4d32}
#sound{background:#201d23d9;color:#dbc49e;border:1px solid #897451;border-radius:9px;min-height:41px;padding:8px 13px;font:800 11px Arial,sans-serif}
#audioNotice{position:absolute;z-index:20;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:90%;background:#201722ee;border:1px solid #a1875f;border-radius:8px;padding:8px 14px;font:12px/1.4 Arial,sans-serif;text-align:center;color:#ffe3ae}
#audioNotice[hidden]{display:none}
#skip{position:absolute;z-index:13;right:18px;top:max(18px,env(safe-area-inset-top));font:800 11px Arial,sans-serif;border:0;background:transparent;color:#e3c896;opacity:.74;padding:10px;display:none}
.playing #skip{display:block}
@media(max-height:620px){#content{min-height:0;padding:40px 15px 60px}#crestwrap{height:30vh;width:25vh}#tagline{margin-top:12px}.rule{margin-top:8px}}
@media(prefers-reduced-motion:reduce){.ember{animation:none!important}}
</style>
</head>
<body>
<main id="stage" aria-label="Failure Entertainment studio introduction">
 <div id="embers" aria-hidden="true"></div>
 <div id="content">
 <div id="crestwrap"><div id="burst" aria-hidden="true"></div>
 <svg id="crest" viewBox="-120 -145 240 287" role="img" aria-label="Antique gold shield with a lightning-shaped crack">
  <defs>
   <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#583821"/><stop offset=".17" stop-color="#d5aa74"/><stop offset=".32" stop-color="#fff0bc"/><stop offset=".55" stop-color="#9a6940"/><stop offset=".82" stop-color="#dfb785"/><stop offset="1" stop-color="#654028"/></linearGradient>
   <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#333035"/><stop offset=".48" stop-color="#0a0a11"/><stop offset="1" stop-color="#4a3930"/></linearGradient>
  </defs>
  <g id="shieldLeft" fill="url(#gold)" stroke="#f3d5a1" stroke-width="2">
   <path d="M0 -125 Q-55 -121 -94 -94 L-90 -20 Q-85 66 0 125 L-9 69 L7 30 L-10 -8 L7 -51 Z"/>
  </g>
  <g id="shieldRight" fill="url(#gold)" stroke="#f3d5a1" stroke-width="2">
   <path d="M0 -125 Q55 -121 94 -94 L90 -20 Q85 66 0 125 L-9 69 L7 30 L-10 -8 L7 -51 Z"/>
  </g>
  <path d="M0 -110 Q48 -106 80 -85 L76 -20 Q70 49 0 108 Q-70 49 -76 -20 L-80 -85 Q-48 -106 0 -110Z" fill="url(#black)" stroke="#d2a16e" stroke-width="1.5"/>
  <path d="M-49 -62 L49 -62 M-45 -42 L45 -42" stroke="#d4a977" stroke-width="1" opacity=".55"/>
  <path d="M-25 29 L-11 -1 L-2 18 L12 -23 L24 25" fill="none" stroke="#d1ad7b" stroke-width="3" stroke-linecap="round"/>
  <path id="crack" d="M1 -120 L-10 -66 L10 -31 L-13 5 L16 43 L-7 72 L1 122" fill="none" stroke="#fff0c5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M0 -133 L1 -126 M-100 -88 L-105 -96 M100 -88 L105 -96" stroke="#e4c292" stroke-width="2" opacity=".6"/>
 </svg></div>
 <div id="studio"><div class="failure">FAILURE</div><div class="rule"><span></span><b>ENTERTAINMENT</b><span></span></div></div>
 <p id="tagline">Failure has never been this much fun.</p>
 </div>
 <div id="prestart"><div class="small">INDEPENDENT GAME STUDIO</div><h1>FAILURE<span>ENTERTAINMENT</span></h1><p>Tap below to play the cinematic studio introduction with sound.</p><button type="button" id="begin">▶ PLAY INTRO WITH SOUND</button></div>
 <button id="skip" type="button" aria-label="Skip intro">Skip</button>
 <div id="tools"><button type="button" id="replay">↻ Replay</button><button type="button" id="sound" aria-pressed="true">♫ Sound on</button></div>
 <div id="audioNotice" hidden></div>
 <audio id="introAudio" preload="auto" playsinline style="display:none"></audio>
</main>
<script>
(function(){
"use strict";
const stage=document.getElementById("stage"),start=document.getElementById("prestart"),play=document.getElementById("begin"),
replay=document.getElementById("replay"),sound=document.getElementById("sound"),audio=document.getElementById("introAudio"),notice=document.getElementById("audioNotice");
let soundOn=true,noticeTimer=null,timer=null,audioReady=false;
const N=22050,duration=6.08;
function makeSound(){
 // A short original studio cue: low suspense swell, metal impact and chimes, resolving chord.
 const count=Math.floor(N*duration),samples=new Float32Array(count);
 function tone(at,len,freq,vol,kind){
  const first=Math.floor(at*N),last=Math.min(count,Math.floor((at+len)*N));
  for(let i=first;i<last;i++){
   const t=(i-first)/N,phase=t*2*Math.PI*freq;
   let env=kind==="bell"?Math.exp(-5*t/len):kind==="hit"?Math.exp(-8*t/len)*Math.min(1,t*120):Math.min(1,t*12)*Math.min(1,(len-t)*3);
   const sig=kind==="hit"?Math.sin(phase*(1-t*.7)):Math.sin(phase)+.25*Math.sin(phase*2.01)+.1*Math.sin(phase*3.03);
   samples[i]+=sig*env*vol;
  }
 }
 function hiss(at,len,vol){let v=1;const first=Math.floor(at*N),last=Math.min(count,Math.floor((at+len)*N));for(let i=first;i<last;i++){const t=(i-first)/N;v=.88*v+.12*(Math.random()*2-1);samples[i]+=v*Math.exp(-t*12/len)*vol}}
 tone(.12,2.6,65.41,.09,"pad");tone(.1,2.4,98,.075,"pad");
 tone(.65,1.3,783.99,.18,"bell");tone(.78,1.2,523.25,.1,"bell");
 hiss(1.52,.55,.47);tone(1.56,1,81,.36,"hit");
 [164.81,246.94,329.63,493.88].forEach((f,i)=>tone(2.1,3.6,f,.052+(i===0?.01:0),"pad"));
 tone(2.26,1.8,659.25,.19,"bell");tone(3.25,1.8,987.77,.13,"bell");tone(4.45,1.3,329.63,.11,"bell");
 const pcm=new Int16Array(count);let peak=.001;
 for(let i=0;i<count;i++)peak=Math.max(peak,Math.abs(samples[i]));
 for(let i=0;i<count;i++){const tail=Math.min(1,(duration-i/N)/.22);pcm[i]=Math.round(Math.max(-1,Math.min(1,samples[i]/peak*.74*tail))*32767)}
 const buffer=new ArrayBuffer(44+pcm.length*2),v=new DataView(buffer);
 function txt(i,s){for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j))}
 txt(0,"RIFF");v.setUint32(4,36+pcm.length*2,true);txt(8,"WAVE");txt(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,N,true);v.setUint32(28,N*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);txt(36,"data");v.setUint32(40,pcm.length*2,true);
 for(let i=0;i<pcm.length;i++)v.setInt16(44+i*2,pcm[i],true);
 return URL.createObjectURL(new Blob([buffer],{type:"audio/wav"}));
}
try{audio.src=makeSound();audio.load();audioReady=true}catch(e){audioReady=false}
for(let i=0;i<48;i++){
 const x=document.createElement("i");x.className="ember";x.style.left=(i*37.7)%100+"%";x.style.top=(i*13.8)%90+"%";
 x.style.animationDelay=(-i*.157)+"s";x.style.animationDuration=(3.5+(i%7)*.43)+"s";
 document.getElementById("embers").appendChild(x);
}
function notify(msg){notice.textContent=msg;notice.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.hidden=true,3800)}
function resetScene(){
 stage.classList.remove("playing");
 // A synchronous layout flush ensures replay starts every CSS animation again.
 void stage.offsetWidth;
 stage.classList.add("playing");
}
function startIntro(){
 start.hidden=true;
 clearTimeout(timer);audio.pause();
 try{audio.currentTime=0}catch(e){}
 resetScene();
 if(soundOn&&audioReady){
  const result=audio.play();
  if(result&&result.catch)result.catch(()=>notify("If sound is blocked, open this link directly in Safari and tap Replay."));
 }else if(soundOn&&!audioReady)notify("Sound is unavailable, but the animation will still play.");
 timer=setTimeout(()=>{stage.dispatchEvent(new CustomEvent("failure-intro-finished",{bubbles:true}))},6200);
}
function toggleSound(){
 soundOn=!soundOn;
 sound.textContent=soundOn?"♫ Sound on":"♫ Sound off";sound.setAttribute("aria-pressed",String(soundOn));audio.muted=!soundOn;
 if(soundOn&&stage.classList.contains("playing")&&audioReady){const p=audio.play();if(p?.catch)p.catch(()=>notify("Tap Replay to restart with sound."))}
}
function skipIntro(){
 start.hidden=true;clearTimeout(timer);audio.pause();stage.classList.add("playing");
 document.getElementById("crestwrap").style.cssText="opacity:1;transform:none;animation:none";
 document.getElementById("studio").style.cssText="opacity:1;transform:none;animation:none";
 document.getElementById("tagline").style.cssText="opacity:1;transform:none;animation:none";
}
play.addEventListener("click",startIntro);
replay.addEventListener("click",()=>{["crestwrap","studio","tagline"].forEach(id=>document.getElementById(id).removeAttribute("style"));startIntro()});
sound.addEventListener("click",toggleSound);
document.getElementById("skip").addEventListener("click",skipIntro);
document.addEventListener("visibilitychange",()=>{if(document.hidden)audio.pause()});
window.FailureEntertainmentIntro={play:startIntro,setSound:function(v){if(soundOn!==!!v)toggleSound()},durationMs:6200};
})();
</script>
</body>
</html>
